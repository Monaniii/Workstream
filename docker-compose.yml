version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: multiii
      POSTGRES_USER: multiii
      POSTGRES_PASSWORD: multiii
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiii -d multiii"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:}
      DATABASE_URL: postgres://multiii:multiii@db:5432/multiii
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PORT: ${PORT:-6000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    ports:
      - "${PORT:-6000}:${PORT:-6000}"
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:${PORT:-6000} config.wsgi:application"

  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DATABASE_URL: postgres://multiii:multiii@db:5432/multiii
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info

  beat:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DATABASE_URL: postgres://multiii:multiii@db:5432/multiii
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A config beat -l info

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  media_volume:
  static_volume:
