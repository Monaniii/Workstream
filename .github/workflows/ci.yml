name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DJANGO_SETTINGS_MODULE: config.settings
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/multiii_test
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: 
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  FRONTEND_URL: http://localhost:5173
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_WEBHOOK_SECRET: whsec_ci
  DEFAULT_FROM_EMAIL: noreply@ci.multiii.local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Install lint tools
        run: pip install flake8 black
      - name: Run flake8
        run: python -m flake8 backend --max-line-length=100 --ignore=E203,W503 --exclude=migrations
      - name: Run black check
        run: python -m black --check backend
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multiii_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d multiii_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        if: always()

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, migrations]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: multiii/backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: multiii/frontend:ci
      - name: Compose config check
        run: docker compose config --quiet
